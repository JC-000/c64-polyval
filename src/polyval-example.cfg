# ---------------------------------------------------------------------------
# polyval-example.cfg — example ld65 config for a consumer linking
# c64-polyval as an archive (c64-lib-contract SPEC §6.1: `make lib` ships
# this alongside build/lib/polyval.a and build/lib/polyval.inc).
#
# COPY THIS INTO YOUR OWN TREE AND EDIT THE MEMORY{} BLOCK. What you must
# not silently drop is the SEGMENTS{} block below: it names every
# LIB_POLYVAL_* segment and carries the placement attributes this
# library's correctness and performance depend on (SPEC §4). Those
# attributes are annotated in place, with the consequence of dropping
# each one, because ld65 will not tell you.
#
# This is a CONSUMER template, not the config c64-polyval builds itself
# with. The library's own configs are src/c64.cfg (full demo app at
# $0801) and src/lib_only.cfg (library-only verification link at $4000);
# neither is meant to be copied, and lib_only.cfg in particular carries
# verification scaffolding — a mandatory LOADADDR segment and the
# LIB_POLYVAL_VERIFY_CODE segment for `make lib-verify`'s stub — that a
# consumer does not have and would take a warning for.
#
# The layout here is a plain $0801 BASIC-stub C64 program. It is a
# starting point: relocate MAIN, split the library into its own memory
# area, or overlay LIB_POLYVAL_*_CODE as you like. The SEGMENTS
# attributes are what must survive that editing.
# ---------------------------------------------------------------------------

MEMORY {
    ZP:       start = $0002, size = $00FE, type = rw, define = yes;

    # 2-byte PRG load address header.
    LOADADDR: start = $07FF, size = $0002, file = %O;

    # Your program plus the library. `define = yes` publishes
    # __MAIN_START__ / __MAIN_SIZE__, which lets you bind the library's
    # §5 footprint equates to a real budget at link time — see the
    # assert example at the bottom of this file.
    MAIN:     start = $0801, size = $9700, file = %O, define = yes;
}

SEGMENTS {
    ZEROPAGE:                      load = ZP,       type = zp;
    LOADADDR:                      load = LOADADDR, type = ro;

    # --- Your own program ----------------------------------------------
    # c64-polyval never emits into these; SPEC §4 forbids a library
    # using the default segment names precisely so they stay yours.
    STARTUP:                       load = MAIN, type = ro, optional = yes;
    CODE:                          load = MAIN, type = ro;
    RODATA:                        load = MAIN, type = ro, optional = yes;
    DATA:                          load = MAIN, type = rw,  optional = yes;
    BSS:                           load = MAIN, type = bss, optional = yes, define = yes;

    # --- c64-polyval code (SPEC §4 prefixed segments) -------------------
    # `optional = yes` throughout so that linking a POLYVAL-only archive
    # (polyval-long.a / -short.a / -compact.a, which ship no AES and no
    # GCM-SIV) does not fail on the segments those archives omit. Only
    # one of the three profile CODE segments is ever present, whichever
    # archive you linked.
    LIB_POLYVAL_AES_CODE:          load = MAIN, type = ro, optional = yes;
    LIB_POLYVAL_GCMSIV_CODE:       load = MAIN, type = ro, optional = yes;
    LIB_POLYVAL_LONG_CODE:         load = MAIN, type = ro, optional = yes;
    LIB_POLYVAL_SHORT_CODE:        load = MAIN, type = ro, optional = yes;
    LIB_POLYVAL_COMPACT_CODE:      load = MAIN, type = ro, optional = yes;

    # --- c64-polyval rodata ---------------------------------------------
    # REQUIRED type = ro in a file-emitting memory area — CORRECTNESS.
    # The segment carries 522 initialised bytes (aes_sbox, aes_inv_sbox,
    # aes_rcon) that every AES path reads. Under `type = bss` ld65 does
    # not emit them and AES substitutes power-on garbage for the S-box,
    # producing wrong ciphertext and wrong tags rather than an error.
    #
    # Do not rely on a diagnostic here. ld65 V2.18 warns on a bss flip
    # only because these particular bytes are non-zero — the warning
    # keys on byte value, not on bss-ness — and it still exits 0. Mid-area
    # the same flip also shortens the image, so everything loaded after
    # this segment lands at the wrong address.
    LIB_POLYVAL_AES_RODATA:        load = MAIN, type = ro, optional = yes;

    # --- c64-polyval BSS -------------------------------------------------
    LIB_POLYVAL_BSS:               load = MAIN, type = bss, optional = yes, define = yes;
    LIB_POLYVAL_AES_BSS:           load = MAIN, type = bss, optional = yes, define = yes;
    LIB_POLYVAL_GCMSIV_BSS:        load = MAIN, type = bss, optional = yes, define = yes;

    # --- c64-polyval runtime-filled tables -------------------------------
    # REQUIRED align = $100 on all three — PERFORMANCE, not correctness
    # and not constant-time (this library is not CT; see API.md §6).
    # Every table access is a linker-resolved abs,x / abs,y with no
    # high-byte address math, so an unaligned table still computes the
    # right answer. What it costs is a page-cross penalty on hot-loop
    # reads for some indices, which invalidates the documented cycle
    # counts (3,917 cy LONG / 18,776 cy SHORT multiply, and the 17-block
    # SHORT/LONG crossover derived from them).
    #
    # Dropping these is COMPLETELY SILENT. The alignment is expressed
    # only here — src/data.s reserves with .res and carries no source-level
    # .align — so ld65 has no explicit request to check against and emits
    # no diagnostic at any level.
    #
    # LIB_POLYVAL_LONG_HTABLE8 / _REDUCE8 are 4 KB each and exist only in
    # the LONG profile; they are absent from SHORT and COMPACT archives,
    # which is why every entry here is optional.
    LIB_POLYVAL_HTABLE:        load = MAIN, type = bss, align = $100, optional = yes, define = yes;
    LIB_POLYVAL_LONG_HTABLE8:  load = MAIN, type = bss, align = $100, optional = yes, define = yes;
    LIB_POLYVAL_LONG_REDUCE8:  load = MAIN, type = bss, align = $100, optional = yes, define = yes;
}

# ---------------------------------------------------------------------------
# Recommended link-time asserts, for one of your own translation units.
# Imported symbols have no value until link, so these MUST use
# .assert/lderror — .if/.error fails to assemble with "Constant
# expression expected" (SPEC §1).
#
#   .import LIB_POLYVAL_ABI_VERSION
#   .assert LIB_POLYVAL_ABI_VERSION = 1, lderror, "c64-polyval exported-surface generation changed; re-check the integration"
#
#   ; §5 footprint against this cfg's MAIN budget. Declared values are
#   ; safe-direction (rounded up), so declared <= budget implies
#   ; actual <= budget. COLD is a reclaimable-after-init carve-out of
#   ; the RESIDENT image here, so RESIDENT alone bounds the load image.
#   .import LIB_POLYVAL_RESIDENT_BYTES
#   .import __MAIN_SIZE__
#   .assert LIB_POLYVAL_RESIDENT_BYTES < __MAIN_SIZE__, lderror, "c64-polyval does not fit the MAIN budget"
#
#   ; §5 published input bound. Assert against the symbol rather than
#   ; hard-coding 64. Note the `#<` when using it as an immediate: an
#   ; .import'ed symbol has no assemble-time value, so a bare
#   ; `lda #LIB_POLYVAL_GCMSIV_MAX_PT_LEN` is a ca65 "Range error".
#   .import LIB_POLYVAL_GCMSIV_MAX_PT_LEN
#   .assert MY_MAX_MESSAGE <= LIB_POLYVAL_GCMSIV_MAX_PT_LEN, lderror, "message longer than c64-polyval accepts"
#
# If you link c64-polyval alongside another c64-lib-contract library,
# build both with `-D LIB_NO_BARE_EXPORTS=1` and import only the
# prefixed LIB_POLYVAL_* names — the bare LIB_VERSION_* / LIB_ABI_VERSION
# forms are identical across every adopter and collide.
# ---------------------------------------------------------------------------
